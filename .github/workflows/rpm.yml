# Builds the reims-os-vgpu RPM that reims-os installs.
#
# The image consumes a *release asset*, not this repository: reims-os pins a
# version and fetches it, so a change here reaches an image only by cutting a
# release. That is the same rule reims-os-installer follows and the reason
# neither project is a submodule of the other.
name: rpm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read by default; the release job raises its own to contents: write. Stating it
# here means a new job cannot quietly inherit more than it needs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: |
          set -euxo pipefail
          dnf -y install \
            rpm-build rpmdevtools git-core \
            cargo rust gcc make ninja-build meson python3 \
            glib2-devel pixman-devel vulkan-loader-devel vulkan-headers

      - uses: actions/checkout@v5
        with:
          # QEMU is a submodule and the build needs its source, not a pointer.
          submodules: recursive

      - name: Derive the version from the tag
        id: version
        run: |
          set -euxo pipefail
          # A workflow_dispatch has no tag; 0.0.0 marks a build that must not
          # be mistaken for a release.
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF_TYPE" in tag) ;; *) version="0.0.0" ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the RPM
        run: |
          set -euxo pipefail
          version="${{ steps.version.outputs.version }}"
          rpmdev-setuptree
          # rpmbuild derives the tarball name it wants from the spec's Version:,
          # so the spec has to carry the version being built. --define does not
          # do this: it defines a macro the spec never reads, leaving Version:
          # untouched and %prep looking for a tarball nobody made.
          sed -i "s/^Version:.*/Version:        ${version}/" packaging/reims-os-vgpu.spec
          grep -q "^Version:        ${version}$" packaging/reims-os-vgpu.spec
          # The spec's %autosetup expects the tree under <name>-<version>/.
          #
          # flags=r is load-bearing. Without it --transform rewrites SYMLINK
          # TARGETS as well as names, and QEMU's tree is full of relative links:
          # subprojects/libvhost-user/standard-headers/linux points at
          # ../../../include/standard-headers/linux, whose leading ".." matches
          # ^\. and became "reims-os-vgpu-0.0.1./../include/...". The build then
          # failed on a missing standard-headers/linux/virtio_config.h that was
          # present in the tree the whole time.
          tar --exclude-vcs --exclude=vm/disks \
              --transform "flags=r;s,^\.,reims-os-vgpu-${version}," \
              -czf ~/rpmbuild/SOURCES/reims-os-vgpu-${version}.tar.gz .
          rpmbuild -bb packaging/reims-os-vgpu.spec \
            --define "_topdir $HOME/rpmbuild"

      - uses: actions/upload-artifact@v7
        with:
          name: reims-os-vgpu-rpm
          path: ~/rpmbuild/RPMS/*/*.rpm

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Not in the Fedora container: this needs no build tools, and the container
    # has no gh. Attaching from the host runner also means the action can create
    # the release, which a tag push does not do on its own.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: reims-os-vgpu-rpm
          path: dist

      - name: Attach the RPM to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.rpm
          fail_on_unmatched_files: true
